<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        form { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        input, select { padding: 8px; margin: 5px 0 10px 0; width: 100%; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none;
                 border-radius: 4px; cursor: pointer; font-size: 16px; }
        .movie-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .movie-card h3 { margin: 0 0 5px 0; }
        .rating { color: #888; font-size: 14px; }
        .description { margin-top: 10px; color: #555; }
    </style>
</head>
<body>

<h1>🎬 Movie Manager</h1>

<!-- Add Movie Form -->
<form th:action="@{/add}" th:object="${newMovie}" method="post">
    <h2>Add a Movie</h2>

    <label>Movie Title:</label>
    <input type="text" th:field="*{title}" placeholder="e.g. The Dark Knight" required />

    <label>Rating:</label>
    <select th:field="*{rating}">
        <option value="G">G</option>
        <option value="PG">PG</option>
        <option value="PG-13">PG-13</option>
        <option value="R">R</option>
    </select>

    <button type="submit">Add Movie + Generate Description</button>
</form>

<!-- Movie List -->
<h2>All Movies</h2>
<div th:if="${#lists.isEmpty(movies)}">
    <p>No movies yet. Add one above!</p>
</div>
<div th:each="movie : ${movies}" class="movie-card">
    <h3 th:text="${movie.title}">Title</h3>
    <p class="rating" th:text="'Rating: ' + ${movie.rating}">Rating</p>
    <p class="description" th:text="${movie.description}">Description</p>
</div>

</body>
</html>
